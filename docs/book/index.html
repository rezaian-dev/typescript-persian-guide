<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>مطالعه آنلاین | مرجع جامع TypeScript</title>
<meta name="description" content="نسخه آنلاین کتاب مرجع جامع TypeScript — ۲۲۰ صفحه، ۴۰ فصل"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%233178C6'/><text x='32' y='44' font-size='32' font-weight='bold' font-family='monospace' fill='white' text-anchor='middle'>TS</text></svg>"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"/>
<style>
:root{--navy:#111A30;--ink:#18233F;--line:#273452;--gold:#E3B341;--mut:#8EA0BD}
.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;flex-shrink:0}
.i.f{fill:currentColor;stroke:none}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Vazirmatn,system-ui,sans-serif;background:var(--navy);color:#D6DEED;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:10;background:rgba(17,26,48,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar a.home{color:var(--gold);font-weight:700;font-size:.9rem}
.bar .title{font-size:.85rem;color:var(--mut);margin-inline-end:auto}
.nav{display:flex;align-items:center;gap:6px}
button,.dl{border:1px solid var(--line);background:#131D36;color:#D6DEED;border-radius:9px;padding:6px 14px;font-family:inherit;font-size:.85rem;cursor:pointer;transition:.15s;text-decoration:none}
button:hover,.dl:hover{border-color:var(--gold);color:var(--gold)}
button:disabled{opacity:.35;cursor:default}
#pageno{width:64px;text-align:center;border:1px solid var(--line);background:#0F1830;color:#fff;border-radius:9px;padding:6px 4px;font-family:inherit;font-size:.85rem;direction:ltr}
.total{font-size:.8rem;color:var(--mut);direction:ltr}
main{flex:1;display:flex;justify-content:center;padding:18px 8px 40px}
#stage{position:relative;max-width:100%}
canvas{display:block;max-width:100%;height:auto!important;border-radius:8px;box-shadow:0 18px 60px rgba(0,0,0,.5);background:#fff}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:.9rem}
.hint{text-align:center;font-size:.72rem;color:#667085;padding-bottom:18px}
@media(max-width:640px){
  .bar{padding:8px 10px;gap:6px}
  .bar .title{display:none}
  .nav{width:100%;justify-content:center}
  button,.dl{padding:7px 10px;font-size:.78rem}
  #pageno{width:50px;padding:7px 2px;font-size:.8rem}
  main{padding:10px 4px 28px}
  .hint{font-size:.66rem;padding-inline:14px}
}
@media(max-width:380px){
  button,.dl{padding:6px 8px;font-size:.72rem}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
<symbol id="i-github" viewBox="0 0 24 24"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.16 1.18a11 11 0 0 1 5.76 0c2.19-1.49 3.15-1.18 3.15-1.18.63 1.59.24 2.76.12 3.05.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.26 5.66.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.68.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></symbol>
<symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
<symbol id="i-chev-l" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
</defs></svg>
<header>
  <div class="bar">
    <a class="home" href="../" style="display:inline-flex;align-items:center;gap:8px">
      <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:#3178C6;color:#fff;font-size:.72rem;font-weight:800;direction:ltr">TS</span>
      <svg class="i"><use href="#i-home"/></svg> صفحه کتاب</a>
    <span class="title">مرجع جامع TypeScript — نسخه آنلاین</span>
    <nav class="nav">
      <button id="next" style="display:inline-flex;align-items:center;gap:5px">صفحه بعد <svg class="i"><use href="#i-chev-l"/></svg></button>
      <input id="pageno" type="number" min="1" value="1" aria-label="شماره صفحه"/>
      <span class="total" id="total">/ …</span>
      <button id="prev" style="display:inline-flex;align-items:center;gap:5px"><svg class="i"><use href="#i-chev-r"/></svg> صفحه قبل</button>
      <a class="dl" href="../pdf/TypeScript-Persian-Guide.pdf" download style="display:inline-flex;align-items:center;gap:6px"><svg class="i"><use href="#i-download"/></svg> PDF</a>
    </nav>
  </div>
</header>
<main><div id="stage"><canvas id="cv"></canvas><div id="loading">در حال بارگذاری کتاب…</div></div></main>
<p class="hint">پیمایش: دکمه‌ها، کلیدهای ← →، کشیدن انگشت (موبایل) یا وارد کردن شماره صفحه</p>

  <a href="https://github.com/rezaian-dev/typescript-persian-guide" style="color:var(--mut);display:inline-flex;align-items:center;gap:5px"><svg class="i f"><use href="#i-github"/></svg> GitHub</a>
  <span style="display:inline-flex;align-items:center;gap:5px">ساخته‌شده با <svg class="i" style="color:#E5484D;fill:#E5484D;stroke:none"><use href="#i-heart"/></svg></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/motion@12.23.26/dist/motion.js"></script>
<script>
(function(){
  if(!window.Motion || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const {animate, stagger} = Motion;
  animate(".bar > *, .bar .nav > *",{opacity:[0,1],y:[-10,0]},{duration:.45,delay:stagger(.06),ease:[.22,1,.36,1]});
  animate("#stage",{opacity:[0,1],scale:[.97,1]},{duration:.6,delay:.2,ease:[.22,1,.36,1]});
})();
</script>
<script type="module">
import * as pdfjs from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";
pdfjs.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const loading = document.getElementById("loading");
const inp = document.getElementById("pageno"), tot = document.getElementById("total");
const prev = document.getElementById("prev"), next = document.getElementById("next");

const params = new URLSearchParams(location.search);
let cur = Math.max(1, parseInt(params.get("page") || "1", 10) || 1);
let doc = null, rendering = false, pending = null;

const fa = n => String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);

async function render(n) {
  if (!doc) return;
  n = Math.min(Math.max(1, n), doc.numPages);
  if (rendering) { pending = n; return; }
  rendering = true; cur = n;
  inp.value = n;
  prev.disabled = n <= 1; next.disabled = n >= doc.numPages;
  history.replaceState(null, "", "?page=" + n);
  const page = await doc.getPage(n);
  const cssW = Math.min(900, document.documentElement.clientWidth - 24);
  const base = page.getViewport({ scale: 1 });
  const scale = (cssW / base.width) * (window.devicePixelRatio > 1 ? 2 : 1.5);
  const vp = page.getViewport({ scale });
  cv.width = vp.width; cv.height = vp.height;
  cv.style.width = cssW + "px";
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  loading.style.display = "none";
  if (window.Motion) Motion.animate(cv, { opacity: [.45, 1], y: [6, 0] }, { duration: .3, ease: "easeOut" });
  rendering = false;
  if (pending !== null && pending !== cur) { const p = pending; pending = null; render(p); }
  else pending = null;
}

try {
  doc = await pdfjs.getDocument("../pdf/TypeScript-Persian-Guide.pdf").promise;
  tot.textContent = "/ " + doc.numPages;
  render(cur);
} catch (e) {
  loading.innerHTML = 'بارگذاری ناموفق بود — <a style="color:#E3B341" href="../pdf/TypeScript-Persian-Guide.pdf">PDF را دانلود کنید</a>';
}

prev.onclick = () => render(cur - 1);
next.onclick = () => render(cur + 1);
inp.onchange = () => render(parseInt(inp.value, 10) || 1);
addEventListener("keydown", e => {
  if (e.target === inp) return;
  if (e.key === "ArrowLeft") render(cur + 1);   // RTL: چپ = جلو
  if (e.key === "ArrowRight") render(cur - 1);
});
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => render(cur), 200); });
let tx = 0, ty = 0;
addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) dx < 0 ? render(cur + 1) : render(cur - 1);
}, { passive: true });
</script>
</body>
